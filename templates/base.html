<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Киномагазин — отзывы{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --accent: #6c5ce7; --accent-dark: #5649c0; }
    body { background: linear-gradient(160deg, #f8f9ff 0%, #eef2ff 45%, #f5f7fa 100%); min-height: 100vh; }
    .navbar { background: linear-gradient(90deg, var(--accent) 0%, var(--accent-dark) 100%) !important; }
    .card { border: none; border-radius: 16px; box-shadow: 0 8px 32px rgba(44,62,80,.08); }
    .btn-primary { background: var(--accent); border-color: var(--accent); border-radius: 10px; }
    .btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
    .badge-sent { font-size: 0.95rem; padding: 0.5em 0.75em; border-radius: 8px; }
    footer { color: #6c757d; font-size: 0.85rem; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-dark navbar-expand-lg mb-4">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{{ url_for('index') }}">КиноОтзывы ML</a>
      <div class="navbar-nav flex-row gap-3">
        <a class="nav-link text-white" href="{{ url_for('index') }}">Главная</a>
        <a class="nav-link text-white" href="{{ url_for('products_stats') }}">Товары (фильмы)</a>
      </div>
      <span class="navbar-text text-white-50 small">ID: {% if user_id %}{{ user_id[:8] }}…{% else %}—{% endif %}</span>
    </div>
  </nav>
  <main class="container pb-5">
    {% block content %}{% endblock %}
  </main>
  <footer class="text-center py-3 border-top bg-white mt-auto">
    Практическая работа: ML + Flask + SQLite · отчёт: <code>imdb_report.png</code>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
